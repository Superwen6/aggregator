name: Refresh
on:
  # performed every two hours
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}
  cancel-in-progress: true

env:
  # time zone
  TZ: Asia/Shanghai

  # github access token
  GIST_PAT: ${{ secrets.GIST_PAT }}

  # github username and gist id, separated by '/'
  GIST_LINK: ${{ secrets.GIST_LINK }}

  # the url to the list of airports that you maintain yourself
  # each line include domain, coupon and invitation code, the domain must be included, and the latter two items are optional
  CUSTOMIZE_LINK: ${{ secrets.CUSTOMIZE_LINK }}

  # include special protocols, such as vless hysteria2 and hysteria
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Check
        run: |
          if [ -z "$GIST_PAT" ]; then
              echo "Error: environment 'GIST_PAT' cannot be empty"
              exit 1
          fi

          if [ -z "$GIST_LINK" ]; then
              echo "Error: environment 'GIST_LINK' cannot be empty"
              exit 1
          fi

          LINK_PARTS=$(echo "$GIST_LINK" | awk -F'/' 'NF==2 && $1!="" && $2!=""')
          if [ -z "$LINK_PARTS" ]; then
              echo "Error: environment 'GIST_LINK' is not valid, should be 'username/gist_id' format"
              exit 1
          fi

      - name: Refresh
        run: python -u subscribe/collect.py --all --refresh --overwrite --skip

      - name: Publish to subscription repo
        if: success()
        uses: actions/checkout@v4
        with:
          repository: Superwen6/backup-sub
          token: ${{ secrets.GIST_PAT }}
          path: backup-sub

      - name: Copy and push subscriptions
        if: success()
        run: |
          set -e
          for f in clash.yaml v2ray.txt singbox.json; do
            if [ ! -s "data/$f" ]; then echo "missing data/$f"; exit 1; fi
          done
          cp data/clash.yaml data/v2ray.txt data/singbox.json backup-sub/
          cd backup-sub
          git config user.name "aggregator-bot"
          git config user.email "aggregator-bot@users.noreply.github.com"
          git add clash.yaml v2ray.txt singbox.json
          if git diff --cached --quiet; then
            echo "no subscription changes"
          else
            git commit -m "update subscriptions"
            git push
          fi
      - name: Timestamp
        run: date
